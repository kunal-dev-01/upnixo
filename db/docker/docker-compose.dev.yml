# ===================================================================
# Description: Upnixo Docker Compose Development Configuration
# ===================================================================

services:
  db:
    image: postgres:16
    container_name: upnixo-db-dev
    restart: unless-stopped
    env_file: .env.dev
    environment:
      - POSTGRES_DB: ${POSTGRES_DB:-upnixo_db}
      - POSTGRES_USER: ${POSTGRES_USER:-upnixo_admin}
      - POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-upnixo_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - upnixo_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-upnixo_admin} -d ${POSTGRES_DB:-upnixo_db}"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    shm_size: 256mb
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  upnixo_dev_data:
    name: upnixo_dev_data